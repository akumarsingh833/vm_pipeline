name: adity-CI
run-name: first-run

on:
  # 1. When code is pushed to feature branch
  push:
    branches:
     - 'feature/**'
 # 2. When PR is created/updated targeting main
  pull_request:
     branches:
       - main 
permissions:
    id-token: write
    contents: read

jobs:
  terraform:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./environment/dev
    

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init
        

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

       
